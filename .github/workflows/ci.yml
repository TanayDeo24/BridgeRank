name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests loadtest dashboard
      - run: ruff format --check src tests loadtest dashboard
      - run: pytest --cov=support_search --cov-report=term-missing --cov-report=xml
      - run: python -m support_search.cli build-index
      - run: python -m support_search.cli evaluate
      - run: python -m support_search.cli quality-gate
      - run: docker build -t support-search:${{ github.sha }} .
