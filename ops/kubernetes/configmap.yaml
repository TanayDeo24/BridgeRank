apiVersion: v1
kind: ConfigMap
metadata:
  name: support-search-config
data:
  SEARCH_ENVIRONMENT: production
  SEARCH_ARTIFACT_DIR: /app/artifacts/index/current
  SEARCH_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
  SEARCH_RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
  SEARCH_INDEX_TYPE: hnsw
  SEARCH_HYBRID_ALPHA: "0.55"
  SEARCH_CANDIDATE_K: "50"
  SEARCH_MAX_TOP_K: "50"
  SEARCH_RETAIN_QUERY_TEXT: "false"

