services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      SEARCH_ENVIRONMENT: production
      SEARCH_ARTIFACT_DIR: /app/artifacts/index/current
      SEARCH_DATABASE_URL: postgresql+psycopg://search:search@postgres:5432/search
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
      POSTGRES_DB: search
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search"]
      interval: 5s
      timeout: 3s
      retries: 10
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["./mlruns:/mlflow"]
volumes:
  postgres-data:
