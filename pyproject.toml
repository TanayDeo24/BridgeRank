[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-search"
version = "0.1.0"
description = "End-to-end hybrid retrieval and reranking service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "prometheus-client>=0.21,<1",
  "rank-bm25>=0.2.2,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
ml = [
  "faiss-cpu>=1.8,<2",
  "sentence-transformers>=3,<6",
  "torch>=2.2,<3",
  "transformers>=4.44,<6",
  "mlflow>=2.16,<4",
  "anthropic>=0.40,<1",
  "pandas>=2.2,<3",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "locust>=2.31,<3",
  "pre-commit>=4,<5",
]
dashboard = ["streamlit>=1.38,<2", "pandas>=2.2,<3", "plotly>=5.24,<7"]

[project.scripts]
support-search = "support_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["support_search"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py310"
